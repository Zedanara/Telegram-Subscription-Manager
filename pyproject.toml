[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Autogenerated migration boilerplate -- not hand-maintained, not worth
# reformatting or flagging (e.g. the typing imports every revision template
# includes whether the revision uses them or not).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Deliberately not "UP" (pyupgrade): its two live suggestions right now both
# touch load-bearing code (SubscriptionStatus's str+Enum base, the UTC-time
# helper) that deserves its own deliberate change, not a drive-by lint-config
# fix bundled into unrelated work.
select = ["E", "F", "I"]
