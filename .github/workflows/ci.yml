name: CI

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # No Postgres service needed: the suite runs against plain in-memory
      # objects (the state machine tests) and an in-memory SQLite fixture
      # (tests/conftest.py) rather than a real Postgres instance.
      - name: Test (pytest)
        run: pytest
